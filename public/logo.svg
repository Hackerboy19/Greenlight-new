<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="glGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e8a38" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#0f6027" />
    </linearGradient>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="500" height="500" fill="none" />

  <!-- GL Monogram -->
  <g transform="translate(50, 40)">
    <!-- G Glyph -->
    <path d="M 210 135 C 190 90, 120 90, 100 145 C 75 210, 80 290, 140 315 C 195 330, 220 280, 220 240 L 165 240 L 165 205 L 250 205 L 250 245 C 248 310, 195 350, 130 340 C 60 325, 30 240, 50 160 C 70 80, 150 50, 225 90 C 235 96, 242 105, 248 115 L 210 135 Z" fill="url(#glGreen)" />
    
    <!-- L Glyph -->
    <path d="M 235 75 L 285 75 L 285 285 L 375 285 L 375 335 L 235 335 Z" fill="url(#glGreen)" />
    
    <!-- Center Ribbon with INTERNATIONAL -->
    <rect x="25" y="195" width="350" height="28" fill="#14532d" rx="2" />
    <text x="200" y="215" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="7">INTERNATIONAL</text>
  </g>

  <!-- Typography underneath -->
  <text x="250" y="420" text-anchor="middle" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="2">GREEN LIGHT</text>
  <text x="250" y="450" text-anchor="middle" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="4">BLOG / MAGAZINE</text>
</svg>
